<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5E63">
<meta name="robots" content="noindex">
<title>Anna · Connexion admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  .login{max-width:380px;margin:12vh auto 0;padding:0 16px}
  .login form{display:flex;flex-direction:column;gap:14px}
  .login input{font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .login .btn{justify-content:center;font-size:17px;padding:13px}
  .login .err{min-height:1.4em;margin:0}
</style>
</head>
<body>
<main class="login">
  <div class="card">
    <h1 style="margin:0 0 4px;font-size:24px">Administration</h1>
    <p class="muted" style="margin:0 0 18px">Questions, personnes et réglages d’Anna.</p>
    <form id="login">
      <label class="fl">Identifiant<input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label class="fl">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
  </div>
  <p style="text-align:center"><a href="/parler">Retour à la vue d’Anna</a></p>
</main>
<script>
  const form = document.getElementById('login'), err = document.getElementById('err');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true; button.textContent = 'Connexion…'; err.textContent = '';
    try {
      const r = await fetch('/api/admin-login', {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      if (r.ok) return location.reload();
      err.textContent = r.status === 503
        ? 'L’accès admin n’est pas configuré sur le serveur (ADMIN_USERNAME et ADMIN_PASSWORD).'
        : 'Identifiant ou mot de passe incorrect.';
    } catch { err.textContent = 'Connexion impossible. Vérifiez le réseau et réessayez.'; }
    button.disabled = false; button.textContent = 'Se connecter';
  });
</script>
</body>
</html>
